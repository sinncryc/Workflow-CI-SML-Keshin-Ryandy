name: CI Model Training and Docker Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  train-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Membangun_model/requirements.txt

      - name: Train model and save MLflow model artifact
        working-directory: Membangun_model
        env:
          MLFLOW_TRACKING_MODE: ci
        run: |
          python modelling.py
          test -f model_export/MLmodel
          test -f model_export/conda.yaml
          test -f model_export/requirements.txt

      - name: Upload MLflow model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifact
          path: Membangun_model/model_export/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image using mlflow build-docker
        working-directory: Membangun_model
        run: |
          mlflow models build-docker \
            --model-uri model_export \
            --name ${{ secrets.DOCKERHUB_USERNAME }}/titanic-mlflow-model:latest

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/titanic-mlflow-model:latest
